<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitu · Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
    <style>
        :root {
            --bg: #0a0b10;
            --bg-2: #12141c;
            --panel: rgba(22, 25, 34, 0.72);
            --panel-2: rgba(30, 34, 46, 0.6);
            --line: rgba(255, 255, 255, 0.08);
            --line-2: rgba(255, 255, 255, 0.14);
            --txt: #f2f4f8;
            --txt-dim: #9aa4b6;
            --txt-mute: #626c7e;
            --accent: #6d5efc;
            --accent-2: #22d3ee;
            --grad: linear-gradient(135deg, #6d5efc 0%, #a855f7 55%, #ec4899 100%);
            --ok: #22c55e;
            --warn: #f59e0b;
            --err: #ef4444;
            --radius: 14px;
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
            --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--txt);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(60% 50% at 80% -10%, rgba(109, 94, 252, 0.16), transparent 60%),
                radial-gradient(50% 40% at 0% 110%, rgba(34, 211, 238, 0.12), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

        /* Header */
        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(14px);
            background: rgba(10, 11, 16, 0.6);
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
        .logo {
            width: 30px; height: 30px; border-radius: 9px; background: var(--grad);
            display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 18px rgba(109, 94, 252, 0.45);
        }
        .spacer { flex: 1; }
        .status {
            display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--txt-dim);
            padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--txt-mute); transition: .3s; }
        .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
        .dot.off { background: var(--err); }
        select, .btn {
            font-family: var(--sans); font-size: 13px; color: var(--txt);
            background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: .18s;
        }
        select:hover, .btn:hover { border-color: var(--line-2); background: var(--panel); }
        .btn.ghost { background: transparent; }

        /* Messages */
        .stream {
            flex: 1; overflow-y: auto; padding: 26px 0 20px;
            scroll-behavior: smooth;
        }
        .stream::-webkit-scrollbar { width: 10px; }
        .stream::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 8px; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }

        .msg { display: flex; gap: 14px; margin-bottom: 24px; animation: rise .25s ease; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .avatar {
            flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
            font-size: 14px; font-weight: 700;
        }
        .msg.user .avatar { background: var(--panel); border: 1px solid var(--line-2); }
        .msg.assistant .avatar { background: var(--grad); box-shadow: 0 0 14px rgba(109,94,252,.4); }
        .body { flex: 1; min-width: 0; }
        .role { font-size: 12px; color: var(--txt-mute); margin-bottom: 5px; font-weight: 600; letter-spacing: .3px; }
        .content { font-size: 15px; line-height: 1.7; color: var(--txt); word-wrap: break-word; }
        .content p { margin: 0 0 12px; }
        .content p:last-child { margin-bottom: 0; }
        .content h1, .content h2, .content h3 { margin: 16px 0 10px; line-height: 1.3; }
        .content ul, .content ol { margin: 0 0 12px; padding-left: 22px; }
        .content li { margin: 4px 0; }
        .content a { color: var(--accent-2); text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content code {
            font-family: var(--mono); font-size: 13px; background: rgba(255,255,255,.07);
            padding: 2px 6px; border-radius: 6px;
        }
        .content pre {
            background: #0b0d14; border: 1px solid var(--line); border-radius: 10px;
            padding: 14px 16px; overflow-x: auto; margin: 0 0 12px; position: relative;
        }
        .content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
        .content table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
        .content th, .content td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; font-size: 13px; }
        .content th { background: var(--panel-2); }
        .content blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--txt-dim); margin: 0 0 12px; }
        .content img { max-width: 100%; border-radius: 10px; margin: 8px 0; border: 1px solid var(--line); }

        .cursor::after {
            content: '▋'; color: var(--accent-2); animation: blink 1s step-start infinite; margin-left: 1px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .msg-actions { display: flex; gap: 8px; margin-top: 8px; opacity: 0; transition: .2s; }
        .msg:hover .msg-actions { opacity: 1; }
        .mini {
            font-size: 11px; color: var(--txt-mute); background: none; border: none; cursor: pointer;
            display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 6px;
        }
        .mini:hover { color: var(--txt); background: rgba(255,255,255,.06); }

        /* Tool cards */
        .tools { margin: 6px 0 12px; display: flex; flex-direction: column; gap: 8px; }
        .tool {
            border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2);
            overflow: hidden; transition: .18s;
        }
        .tool-head {
            display: flex; align-items: center; gap: 9px; padding: 9px 13px; cursor: pointer; font-size: 13px;
        }
        .tool-head:hover { background: rgba(255,255,255,.03); }
        .tool-ico { width: 18px; text-align: center; }
        .tool-name { font-family: var(--mono); font-weight: 600; }
        .tool-status { margin-left: auto; font-size: 11px; padding: 2px 9px; border-radius: 999px; }
        .tool-status.running { color: var(--accent-2); background: rgba(34,211,238,.12); }
        .tool-status.completed { color: var(--ok); background: rgba(34,197,94,.12); }
        .tool-status.failed { color: var(--err); background: rgba(239,68,68,.12); }
        .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(34,211,238,.3);
            border-top-color: var(--accent-2); border-radius: 50%; animation: sp .7s linear infinite; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .tool-out {
            display: none; padding: 0 13px 12px; font-family: var(--mono); font-size: 12px;
            color: var(--txt-dim); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
            border-top: 1px solid var(--line); padding-top: 10px;
        }
        .tool.open .tool-out { display: block; }
        .chev { color: var(--txt-mute); transition: .2s; font-size: 11px; }
        .tool.open .chev { transform: rotate(90deg); }

        /* Input */
        .composer { padding: 14px 20px 20px; }
        .composer-inner {
            max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
            background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px;
            padding: 10px 10px 10px 16px; backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px -12px rgba(0,0,0,.6);
        }
        .composer-inner:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,94,252,.15); }
        textarea {
            flex: 1; background: none; border: none; outline: none; resize: none; color: var(--txt);
            font-family: var(--sans); font-size: 15px; line-height: 1.5; max-height: 180px; padding: 6px 0;
        }
        textarea::placeholder { color: var(--txt-mute); }
        .send {
            width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer; flex-shrink: 0;
            background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 17px; transition: .18s;
        }
        .send:hover { transform: scale(1.05); }
        .send:disabled { opacity: .4; cursor: not-allowed; transform: none; }
        .hint { max-width: 860px; margin: 8px auto 0; font-size: 11px; color: var(--txt-mute); text-align: center; }

        /* Empty state */
        .empty { text-align: center; padding: 60px 20px; color: var(--txt-dim); }
        .empty h2 { font-size: 26px; margin-bottom: 10px; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
        .chip {
            padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
            font-size: 13px; cursor: pointer; transition: .18s; color: var(--txt-dim);
        }
        .chip:hover { border-color: var(--accent); color: var(--txt); transform: translateY(-2px); }

        /* Login */
        .overlay {
            position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
            background: rgba(6,7,11,.85); backdrop-filter: blur(10px);
        }
        .card {
            width: 340px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px;
            padding: 30px 26px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8);
        }
        .card .logo { width: 44px; height: 44px; font-size: 22px; margin: 0 auto 16px; }
        .card h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
        .card p { text-align: center; color: var(--txt-mute); font-size: 13px; margin-bottom: 22px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; color: var(--txt-dim); margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 11px 13px; background: var(--bg-2); border: 1px solid var(--line);
            border-radius: 10px; color: var(--txt); font-size: 14px; outline: none; transition: .18s;
        }
        .field input:focus { border-color: var(--accent); }
        .card .send { width: 100%; height: 44px; border-radius: 11px; font-size: 14px; font-weight: 600; margin-top: 6px; }
        .err { color: var(--err); font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }
        .hidden { display: none !important; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--panel); border: 1px solid var(--line-2); padding: 10px 18px; border-radius: 10px;
            font-size: 13px; z-index: 60; opacity: 0; transition: .25s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="brand"><div class="logo">◆</div> Gitu</div>
            <div class="spacer"></div>
            <select id="modelSel" title="Active model"></select>
            <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
            <button class="btn ghost" id="clearBtn" title="Clear conversation">Clear</button>
            <button class="btn ghost" id="logoutBtn">Sign out</button>
        </header>

        <div class="stream" id="stream">
            <div class="wrap" id="msgs"></div>
        </div>

        <div class="composer">
            <div class="composer-inner">
                <textarea id="input" rows="1" placeholder="Message Gitu…"></textarea>
                <button class="send" id="sendBtn" title="Send">➤</button>
            </div>
            <div class="hint">Enter to send · Shift+Enter for a new line</div>
        </div>
    </div>

    <!-- Login -->
    <div class="overlay" id="login">
        <div class="card">
            <div class="logo">◆</div>
            <h1>Welcome back</h1>
            <p>Sign in to your assistant</p>
            <div class="field"><label>Username</label><input id="u" autocomplete="username" /></div>
            <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" /></div>
            <button class="send" id="loginBtn">Sign in</button>
            <div class="err" id="loginErr"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });
        const DEBUG_PREFIX = '__DEBUG__';
        const $ = id => document.getElementById(id);
        const stream = $('stream'), msgs = $('msgs');
        let socket = null, token = localStorage.getItem('gitu_token') || '';
        let runs = {};          // runId -> { el, contentEl, raw, tools:{} }
        let history = [];       // persisted messages

        /* ---------- helpers ---------- */
        function toast(t) {
            const el = $('toast'); el.textContent = t; el.classList.add('show');
            clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800);
        }
        function atBottom() { return stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120; }
        function scrollDown(force) { if (force || atBottom()) stream.scrollTop = stream.scrollHeight; }
        function md(text) { return DOMPurify.sanitize(marked.parse(String(text || ''))); }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

        function saveHistory() {
            try { localStorage.setItem('gitu_history', JSON.stringify(history.slice(-80))); } catch (e) {}
        }
        function loadHistory() {
            try { history = JSON.parse(localStorage.getItem('gitu_history') || '[]'); } catch (e) { history = []; }
            if (!history.length) { renderEmpty(); return; }
            msgs.innerHTML = '';
            history.forEach(m => renderStatic(m));
            scrollDown(true);
        }

        function renderEmpty() {
            msgs.innerHTML = `<div class="empty">
                <h2>How can I help?</h2>
                <p>Ask a question, request research, or automate a task.</p>
                <div class="chips">
                    <div class="chip" data-p="Summarize the latest AI news and give me 3 takeaways">📰 Summarize AI news</div>
                    <div class="chip" data-p="Draft a professional email to a client about a project delay">✉️ Draft an email</div>
                    <div class="chip" data-p="Research the top 5 project management tools and compare them">🔍 Compare tools</div>
                </div></div>`;
            msgs.querySelectorAll('.chip').forEach(c =>
                c.addEventListener('click', () => { $('input').value = c.dataset.p; send(); }));
        }
        function clearEmpty() { const e = msgs.querySelector('.empty'); if (e) e.remove(); }

        /* ---------- rendering ---------- */
        function msgShell(role, avatarText) {
            const wrap = document.createElement('div');
            wrap.className = 'msg ' + role;
            wrap.innerHTML = `<div class="avatar">${avatarText}</div><div class="body">
                <div class="role">${role === 'user' ? 'You' : 'Gitu'}</div>
                <div class="tools"></div><div class="content"></div>
                <div class="msg-actions"></div></div>`;
            return wrap;
        }

        function renderStatic(m) {
            clearEmpty();
            const el = msgShell(m.role, m.role === 'user' ? 'U' : '◆');
            el.querySelector('.content').innerHTML = m.role === 'user' ? esc(m.text).replace(/\n/g, '<br>') : md(m.text);
            if (m.tools && m.tools.length) m.tools.forEach(t => el.querySelector('.tools').appendChild(toolCard(t)));
            addActions(el, m.text);
            msgs.appendChild(el);
        }

        function addActions(el, text) {
            const bar = el.querySelector('.msg-actions'); if (!bar) return;
            const copy = document.createElement('button');
            copy.className = 'mini'; copy.innerHTML = '⧉ Copy';
            copy.onclick = () => { navigator.clipboard.writeText(text || ''); toast('Copied'); };
            bar.appendChild(copy);
        }

        function pushUser(text) {
            clearEmpty();
            const el = msgShell('user', 'U');
            el.querySelector('.content').innerHTML = esc(text).replace(/\n/g, '<br>');
            addActions(el, text);
            msgs.appendChild(el);
            history.push({ role: 'user', text }); saveHistory();
            scrollDown(true);
        }

        function toolCard(t) {
            const card = document.createElement('div');
            card.className = 'tool';
            const running = t.status === 'running' || !t.status;
            const ico = t.status === 'failed' ? '⚠️' : (running ? '<span class="spin"></span>' : '🛠️');
            const label = t.status === 'failed' ? 'failed' : (running ? 'running' : 'completed');
            card.innerHTML = `<div class="tool-head">
                <span class="tool-ico">${ico}</span>
                <span class="tool-name">${esc(t.name || 'tool')}</span>
                <span class="tool-status ${label}">${label}</span>
                <span class="chev">▶</span></div>
                <div class="tool-out">${esc(t.output || t.error || '')}</div>`;
            const head = card.querySelector('.tool-head');
            head.onclick = () => card.classList.toggle('open');
            if (t.error) card.classList.add('open');
            return card;
        }

        /* ---------- streaming lifecycle ---------- */
        function startAssistant(runId) {
            clearEmpty();
            let run = runs[runId];
            if (run) return run;
            const el = msgShell('assistant', '◆');
            el.querySelector('.content').classList.add('cursor');
            msgs.appendChild(el);
            run = runs[runId] = { el, contentEl: el.querySelector('.content'), toolsEl: el.querySelector('.tools'), raw: '', tools: {} };
            scrollDown(true);
            return run;
        }

        function appendDelta(runId, text) {
            const run = runs[runId] || startAssistant(runId);
            run.raw += text || '';
            run.contentEl.innerHTML = md(run.raw);
            scrollDown();
        }

        function finishAssistant(runId, finalText) {
            const run = runs[runId]; if (!run) return;
            const text = (finalText && finalText.trim() && finalText.trim() !== '') ? finalText : run.raw;
            run.raw = text || run.raw;
            run.contentEl.classList.remove('cursor');
            run.contentEl.innerHTML = md(run.raw);
            addActions(run.el, run.raw);
            if ((run.raw || '').trim() || Object.keys(run.tools).length) {
                history.push({ role: 'assistant', text: run.raw, tools: Object.values(run.tools) });
                saveHistory();
            }
            scrollDown();
            delete runs[runId];
        }

        function toolStart(runId, name) {
            const run = runs[runId] || startAssistant(runId);
            (name || 'tool').split(',').map(s => s.trim()).filter(Boolean).forEach(n => {
                if (run.tools[n]) return;
                const t = { name: n, status: 'running' };
                run.tools[n] = t;
                const card = toolCard(t); card.dataset.tool = n;
                run.toolsEl.appendChild(card);
            });
            scrollDown();
        }

        function toolDone(runId, d) {
            const run = runs[runId] || startAssistant(runId);
            const n = d.name || 'tool';
            const t = run.tools[n] || (run.tools[n] = { name: n });
            t.status = d.status === 'failed' ? 'failed' : 'completed';
            t.output = d.output; t.error = d.error;
            let card = run.toolsEl.querySelector(`[data-tool="${CSS.escape(n)}"]`);
            const fresh = toolCard(t); fresh.dataset.tool = n;
            if (card) run.toolsEl.replaceChild(fresh, card); else run.toolsEl.appendChild(fresh);
            scrollDown();
        }

        function addMedia(p) {
            let run = Object.values(runs)[0];
            const url = p.url || (p.path ? p.path : '');
            if (!url) return;
            const html = p.type === 'image'
                ? `<img src="${esc(url)}" alt="${esc(p.caption || 'image')}" />`
                : `<a href="${esc(url)}" target="_blank">${esc(p.caption || url)}</a>`;
            if (run) { run.raw += `\n\n${p.type === 'image' ? `![](${url})` : `[${p.caption || url}](${url})`}\n\n`; run.contentEl.innerHTML = md(run.raw); }
            else { clearEmpty(); const el = msgShell('assistant', '◆'); el.querySelector('.content').innerHTML = html; msgs.appendChild(el); }
            scrollDown();
        }

        /* ---------- socket ---------- */
        function setStatus(state, text) {
            const dot = $('dot');
            dot.className = 'dot ' + (state === 'on' ? 'on' : state === 'off' ? 'off' : '');
            $('statusText').textContent = text;
        }

        function initSocket(tok) {
            token = tok;
            if (socket) socket.disconnect();
            socket = io({ auth: { token } });

            socket.on('connect', () => setStatus('on', 'Online'));
            socket.on('disconnect', () => setStatus('off', 'Disconnected'));
            socket.on('connect_error', () => setStatus('off', 'Connection error'));

            socket.on('login_success', (d) => {
                localStorage.setItem('gitu_token', token);
                localStorage.setItem('gitu_user', d?.username || '');
                $('login').classList.add('hidden');
                setStatus('on', d?.username || 'Online');
                loadHistory();
                loadModels();
            });
            socket.on('auth_error', () => { logout('Session expired, sign in again'); });
            socket.on('login_failed', (d) => { $('loginErr').textContent = d?.message || 'Login failed'; });

            socket.on('assistant_start', d => startAssistant(d.runId));
            socket.on('assistant_delta', d => appendDelta(d.runId, d.text));
            socket.on('assistant_done', d => finishAssistant(d.runId, d.finalText || d.text));
            socket.on('tool_start', d => toolStart(d.runId, d.name));
            socket.on('tool_delta', d => toolStart(d.runId, d.name));
            socket.on('tool_done', d => toolDone(d.runId, d));
            socket.on('tool_error', d => toolDone(d.runId, { ...d, status: 'failed' }));
            socket.on('media', d => addMedia(d));

            // Legacy non-streaming message → route debug noise away from chat
            socket.on('message', (p) => {
                const text = typeof p === 'string' ? p : (p && p.text) || '';
                if (String(text).startsWith(DEBUG_PREFIX)) return; // tool chatter handled by cards
                const t = String(text || '').trim(); if (!t) return;
                // avoid duplicating a message we just streamed
                const last = history[history.length - 1];
                if (last && last.role === 'assistant' && (last.text || '').trim() === t) return;
                if (Object.keys(runs).length) return;
                const rid = 'legacy_' + Date.now();
                startAssistant(rid); finishAssistant(rid, text);
            });
            socket.on('stream_chunk', () => {}); // shell output; shown via tool cards
        }

        /* ---------- actions ---------- */
        function send() {
            const inp = $('input'); const text = inp.value.trim();
            if (!text) return;
            if (!socket || !socket.connected) { $('login').classList.remove('hidden'); return; }
            pushUser(text);
            socket.emit('message', { text });
            inp.value = ''; resize();
        }

        function logout(msg) {
            localStorage.removeItem('gitu_token');
            if (socket) socket.disconnect();
            $('login').classList.remove('hidden');
            $('loginErr').textContent = msg || '';
            setStatus('off', 'Signed out');
        }

        async function loadModels() {
            try {
                const r = await fetch('/api/models'); const d = await r.json();
                const sel = $('modelSel'); sel.innerHTML = '';
                (d.models || []).forEach(m => {
                    const o = document.createElement('option');
                    o.value = m.id; o.textContent = m.name || m.id;
                    if (m.active || m.id === d.current) o.selected = true;
                    sel.appendChild(o);
                });
            } catch (e) {}
        }
        $('modelSel').addEventListener('change', async e => {
            try { await fetch('/api/models/use', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: e.target.value }) }); toast('Model switched'); }
            catch (err) { toast('Switch failed'); }
        });

        async function doLogin() {
            const u = $('u').value.trim(), p = $('p').value;
            if (!u || !p) { $('loginErr').textContent = 'Enter username and password'; return; }
            $('loginErr').textContent = '';
            try {
                const r = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
                if (!r.ok) throw new Error();
                const d = await r.json();
                initSocket(d.token);
            } catch (e) {
                // fall back to socket-based login
                if (!socket) initSocket('');
                socket.emit('login', { username: u, password: p });
            }
        }

        /* ---------- input UX ---------- */
        function resize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
        $('input').addEventListener('input', resize);
        $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
        $('sendBtn').addEventListener('click', send);
        $('loginBtn').addEventListener('click', doLogin);
        $('p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        $('logoutBtn').addEventListener('click', () => logout());
        $('clearBtn').addEventListener('click', () => { history = []; saveHistory(); runs = {}; msgs.innerHTML = ''; renderEmpty(); toast('Cleared'); });

        /* ---------- boot ---------- */
        if (token) { initSocket(token); } else { $('login').classList.remove('hidden'); }
    </script>
</body>

</html>
